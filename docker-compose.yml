services:

  postgres:
    image: postgres:17
    container_name: fan-map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fan_map
      POSTGRES_USER: fan_map
      POSTGRES_PASSWORD: fan_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fan-map-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: