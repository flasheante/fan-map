name: Weekly setlist.fm sync

# Domingo 23:00 hora Argentina (UTC-3) = lunes 02:00 UTC. Gratis en GitHub
# Actions — alternativa al Cron Job de Render, que es pago. El script en sí
# no cambia: sigue siendo sólo `npm run sync:setlist-fm`
# (api/src/cli/sync-setlist-fm.ts), nunca expuesto como endpoint HTTP a
# propósito (ver el comentario de ese archivo).
#
# Requiere estos secrets del repo (Settings → Secrets and variables →
# Actions → New repository secret), con los mismos valores que ya usa la
# API en Render:
#   DATABASE_URL             — la URL EXTERNA de la base (no la interna de
#                               Render, que sólo es alcanzable desde otros
#                               servicios de Render); puede necesitar
#                               ?sslmode=require al final si la conexión
#                               falla por SSL.
#   SETLIST_FM_API_KEY
#   SETLIST_FM_REQUESTS_PER_SECOND (opcional — si no está, el script usa
#                               su propio default)
on:
  schedule:
    - cron: "0 2 * * 1"
  # Para poder correrlo a mano desde la pestaña Actions sin esperar al
  # domingo (ej. para probar que los secrets están bien cargados).
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # A nivel job, no sólo en el último step: prisma.config.ts lee
    # DATABASE_URL con env() incluso para `prisma generate` (que no llega a
    # conectarse a la base, pero sí evalúa la config), así que sin esto acá
    # ya falla antes de llegar al sync.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SETLIST_FM_API_KEY: ${{ secrets.SETLIST_FM_API_KEY }}
      SETLIST_FM_REQUESTS_PER_SECOND: ${{ secrets.SETLIST_FM_REQUESTS_PER_SECOND }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      # `npm ci` sólo instala paquetes — a diferencia de versiones viejas de
      # Prisma, acá nada dispara `prisma generate` solo (no hay postinstall
      # para eso), así que sin este paso @prisma/client queda con sus stubs
      # vacíos y ts-node explota con "has no exported member 'PrismaClient'"
      # apenas Nest intenta instanciar PrismaService.
      - run: npx prisma generate

      - run: npm run sync:setlist-fm
